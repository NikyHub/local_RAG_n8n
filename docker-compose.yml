version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: factory-rag-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_ADMIN_PASSWORD:-changeme}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme1234567890}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-n8n_secret}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows
      - ./files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - factory-rag

  postgres:
    image: postgres:15-alpine
    container_name: factory-rag-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD:-n8n_secret}
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - factory-rag

  qdrant:
    image: qdrant/qdrant:latest
    container_name: factory-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - factory-rag

  embedding-service:
    build: ./embedding-service
    container_name: factory-rag-embedding
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - embedding_cache:/app/cache
    environment:
      - MODEL_NAME=BAAI/bge-large-zh-v1.5
      - DEVICE=cpu
    networks:
      - factory-rag

  document-service:
    build: ./document-service
    container_name: factory-rag-doc-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./files:/data/files
    environment:
      - EMBEDDING_SERVICE_URL=http://embedding-service:8001
      - FILES_DIR=/data/files
    networks:
      - factory-rag

volumes:
  n8n_data:
  postgres_data:
  qdrant_data:
  embedding_cache:

networks:
  factory-rag:
    driver: bridge
